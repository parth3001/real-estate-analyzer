# Substrate + Agent-Mesh CI for reanalyzr 2.0
#
# Gates merges into reanalyzr-2.0 on:
#   1. TypeScript compiles cleanly
#   2. Substrate + agent-mesh unit tests pass (W1 + W4)
#   3. End-to-end smoke test passes (PRODUCT_2.0_FIRST_2_WEEKS.md §6
#      exit gate — substrate roundtrip matches direct engine call)
#
# WHY SCOPED, NOT FULL-SUITE
# --------------------------
#
# The full backend test suite has 137 pre-existing failures in legacy
# code (services we haven't refactored, fixtures that drifted from
# implementation, etc.). Running the full suite in CI would make this
# workflow permanently red and useless.
#
# Instead we scope to the surface we OWN and have invariants on:
#   - src/config              (W1-S5 startup verification)
#   - src/models/events       (W1-S1, S2, S6 — base + 11 event types + indexes)
#   - src/models/cost         (W9-S1 — CostEvent operational collection)
#   - src/repositories        (W1-S3, S4 — write + read API;
#                              W9-S1 — CostEventRepository)
#   - src/agents              (W4-S0..S6 — Tool contract + 7 tools)
#   - src/utils/anthropicPricing.ts  (W9-S1 — cost computation)
#
# This is the "wave 1 substrate moat" surface. Regressions here MUST
# block merges. Cleanup of the legacy test failures is a separate
# backlog item (see TECHNICAL_ARCHITECTURE_BACKLOG.md).
#
# The smoke test additionally runs the real legacy analyzers + engine
# wired through the tool chain — so the parts of the legacy code that
# the wave-1 substrate DEPENDS on are still exercised.

name: substrate-ci

on:
  push:
    branches: [reanalyzr-2.0]
    paths:
      - 'backend/src/config/**'
      - 'backend/src/models/events/**'
      - 'backend/src/models/cost/**'
      - 'backend/src/repositories/**'
      - 'backend/src/agents/**'
      - 'backend/src/routes/chat.ts'
      - 'backend/src/routes/__tests__/chat.test.ts'
      - 'backend/src/middleware/chatIdentity.ts'
      - 'backend/src/middleware/chatSessionRateLimit.ts'
      - 'backend/src/middleware/__tests__/chatIdentity.test.ts'
      - 'backend/src/middleware/__tests__/chatSessionRateLimit.test.ts'
      - 'backend/src/models/User.ts'
      - 'backend/src/agents/llm/anthropicAdapter.ts'
      - 'backend/src/agents/runner/agentRunner.ts'
      - 'backend/src/agents/runner/__tests__/agentRunner.test.ts'
      - 'backend/src/agents/qa/qaAgent.ts'
      - 'backend/src/agents/dealScoring/dealScoringAgent.ts'
      - 'backend/src/agents/orchestrator/streamEvents.ts'
      - 'backend/src/agents/orchestrator/__tests__/orchestrator.stream.test.ts'
      - 'backend/src/agents/orchestrator/dealScoreCardProjection.ts'
      - 'backend/src/agents/orchestrator/__tests__/dealScoreCardProjection.test.ts'
      - 'backend/src/routes/__tests__/chat.email-summary.test.ts'
      - 'backend/src/routes/__tests__/chat.claim-session.test.ts'
      - 'backend/src/services/emailService.ts'
      - 'backend/src/services/chatSessionMergeService.ts'
      - 'backend/src/services/__tests__/chatSessionMergeService.test.ts'
      - 'backend/src/services/dealMaterializationService.ts'
      - 'backend/src/services/__tests__/dealMaterializationService.test.ts'
      - 'backend/src/models/Deal.ts'
      - 'backend/src/utils/anthropicPricing.ts'
      - 'backend/src/utils/__tests__/anthropicPricing.test.ts'
      - 'backend/scripts/smoke-test-weeks-1-2.ts'
      - 'backend/scripts/evals/**'
      - 'backend/src/evals/**'
      - 'backend/package.json'
      - 'backend/tsconfig.json'
      - '.github/workflows/substrate-ci.yml'
      # Issue #243 iteration-3 (2026-07-12) — P10 enforcement surface.
      - 'backend/src/domain/strategy/**'
      - 'backend/src/services/analyticsService.ts'
      - 'eslint.config.js'
      - 'eslint.config.p10.js'
      - 'frontend/eslint.config.js'
      - 'scripts/verify-strategy-parity-fixture.js'
  pull_request:
    branches: [reanalyzr-2.0]
    paths:
      - 'backend/src/config/**'
      - 'backend/src/models/events/**'
      - 'backend/src/models/cost/**'
      - 'backend/src/repositories/**'
      - 'backend/src/agents/**'
      - 'backend/src/routes/chat.ts'
      - 'backend/src/routes/__tests__/chat.test.ts'
      - 'backend/src/middleware/chatIdentity.ts'
      - 'backend/src/middleware/chatSessionRateLimit.ts'
      - 'backend/src/middleware/__tests__/chatIdentity.test.ts'
      - 'backend/src/middleware/__tests__/chatSessionRateLimit.test.ts'
      - 'backend/src/models/User.ts'
      - 'backend/src/agents/llm/anthropicAdapter.ts'
      - 'backend/src/agents/runner/agentRunner.ts'
      - 'backend/src/agents/runner/__tests__/agentRunner.test.ts'
      - 'backend/src/agents/qa/qaAgent.ts'
      - 'backend/src/agents/dealScoring/dealScoringAgent.ts'
      - 'backend/src/agents/orchestrator/streamEvents.ts'
      - 'backend/src/agents/orchestrator/__tests__/orchestrator.stream.test.ts'
      - 'backend/src/agents/orchestrator/dealScoreCardProjection.ts'
      - 'backend/src/agents/orchestrator/__tests__/dealScoreCardProjection.test.ts'
      - 'backend/src/routes/__tests__/chat.email-summary.test.ts'
      - 'backend/src/routes/__tests__/chat.claim-session.test.ts'
      - 'backend/src/services/emailService.ts'
      - 'backend/src/services/chatSessionMergeService.ts'
      - 'backend/src/services/__tests__/chatSessionMergeService.test.ts'
      - 'backend/src/services/dealMaterializationService.ts'
      - 'backend/src/services/__tests__/dealMaterializationService.test.ts'
      - 'backend/src/models/Deal.ts'
      - 'backend/src/utils/anthropicPricing.ts'
      - 'backend/src/utils/__tests__/anthropicPricing.test.ts'
      - 'backend/scripts/smoke-test-weeks-1-2.ts'
      - 'backend/scripts/evals/**'
      - 'backend/src/evals/**'
      - 'backend/package.json'
      - 'backend/tsconfig.json'
      - '.github/workflows/substrate-ci.yml'
      # Issue #243 iteration-3 (2026-07-12) — P10 enforcement surface.
      - 'backend/src/domain/strategy/**'
      - 'backend/src/services/analyticsService.ts'
      - 'eslint.config.js'
      - 'eslint.config.p10.js'
      - 'frontend/eslint.config.js'
      - 'scripts/verify-strategy-parity-fixture.js'

# Cancel in-progress runs for the same ref when a new commit lands.
# Saves GH Actions minutes without hiding genuine regressions.
concurrency:
  group: substrate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Issue #243 iteration-3 (2026-07-12) — P10 enforcement gate.
  #
  # Runs the scoped `lint:p10` script in backend AND frontend. The
  # scoped config (`eslint.config.p10.js`) contains ONLY the P10
  # `no-restricted-syntax` rule, so this gate is independent of the
  # 492 pre-existing frontend errors (issue #258) that would otherwise
  # mask a new violation under `--max-warnings=0`.
  #
  # Second step invokes `scripts/verify-strategy-parity-fixture.js` to
  # catch drift between the FE + BE parity fixture copies (INV-5). Both
  # steps must pass; either failure blocks the merge.
  p10-lint:
    name: P10 lint + parity-fixture verify (Issue #243)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root deps (eslint + typescript-eslint + parser)
        run: npm ci --ignore-scripts
      - name: Install frontend deps (self-contained lint stack)
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Backend lint:p10
        run: npm run lint:p10
        working-directory: backend
      - name: Frontend lint:p10
        run: npm run lint:p10
        working-directory: frontend
      - name: Strategy parity fixture verify (INV-5)
        run: node scripts/verify-strategy-parity-fixture.js

  typecheck:
    name: TypeScript compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check (no emit)
        run: npx tsc --noEmit

  substrate-tests:
    name: Substrate + agent-mesh unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run W1 + W4 + W9 test slice
        # Scoped to the substrate + cost-events + agent surface — see
        # workflow header comment.
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-memory-server
          EVENTS_ROLE_CHECK_MODE: skip
        run: |
          npx jest \
            src/config \
            src/models/events \
            src/models/cost \
            src/repositories \
            src/agents \
            src/utils/__tests__/anthropicPricing.test.ts \
            src/routes/__tests__/chat.test.ts \
            src/routes/__tests__/chat.email-summary.test.ts \
            src/routes/__tests__/chat.claim-session.test.ts \
            src/middleware/__tests__/chatIdentity.test.ts \
            src/middleware/__tests__/chatSessionRateLimit.test.ts \
            src/agents/orchestrator/__tests__/orchestrator.stream.test.ts \
            src/agents/orchestrator/__tests__/dealScoreCardProjection.test.ts \
            src/services/__tests__/chatSessionMergeService.test.ts \
            src/services/__tests__/dealMaterializationService.test.ts \
            --no-coverage \
            --ci \
            --detectOpenHandles=false \
            --forceExit

  smoke-test:
    name: Weeks 1-2 exit-gate smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck, substrate-tests]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run end-to-end smoke test
        # Verifies:
        #   enrich → compute → score → substrate roundtrip matches
        #   direct engine call. 11 checks; all must pass.
        # See PRODUCT_2.0_FIRST_2_WEEKS.md §6 for the exit-gate spec.
        env:
          EVENTS_ROLE_CHECK_MODE: skip
          # CI doesn't have backend/.env; the smoke script doesn't need
          # MONGODB_URI (uses mongodb-memory-server) but it does read
          # other envs at module load. Provide harmless defaults.
          NODE_ENV: test
        run: npm run smoke-test:weeks-1-2

  evals:
    name: Eval scaffolding (schema + substrate calibration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck, substrate-tests]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run schema eval
        # Verifies Zod schema invariants across all 11 substrate event
        # types + cost_events. Tripwire for accidental schema regressions.
        env:
          EVENTS_ROLE_CHECK_MODE: skip
          NODE_ENV: test
        run: npm run eval:schema
      - name: Run substrate calibration eval
        # Calibration drift tripwire — zero-tolerance comparison of
        # substrate-persisted dealQuality against pinned fixture values.
        # Per PRODUCT_2.0_EVALS.md §3 (the deterministic-scoring
        # non-negotiable's regression gate).
        env:
          EVENTS_ROLE_CHECK_MODE: skip
          NODE_ENV: test
        run: npm run eval:substrate
