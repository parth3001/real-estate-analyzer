# ⚠️  NOT THE SOURCE OF TRUTH — Render services are configured in the
#     DASHBOARD, not from this Blueprint.
#
#     Evidence (2026-08-30): this file names the static site
#     `real-estate-analyzer-frontend`, but production actually serves from
#     `real-estate-analyzer-9ise.onrender.com` — the random suffix Render
#     appends to dashboard-created services. The backend's `CORS_ORIGIN`
#     below also references that non-existent service name via
#     `fromService:`, which a synced Blueprint would fail to resolve.
#
#     Treat everything below as DOCUMENTATION of intended configuration.
#     Changing it does not change production. Apply changes in the Render
#     dashboard, then mirror them here so the two don't drift further.
#
#     Settings that must be verified in the dashboard, because the values
#     here are known-wrong or known-inert:
#
#       Static site
#         - Publish directory MUST be `dist` (Vite's default output).
#           The CRA-era `build` is wrong; frontend/build only exists if
#           the `cp -r dist/* build/` shim below runs.
#         - VITE_API_URL must be a literal ending in /api:
#             https://real-estate-analyzer-api.onrender.com/api
#           (services/api.ts uses it as the axios baseURL and callers
#           pass bare paths like `/deals`.)
#         - Cache-Control: scope no-store to /index.html only. A blanket
#           /* no-store re-downloads the whole 2.7 MB bundle every load.
#         - Do NOT add a catch-all rewrite in the dashboard — it shadows
#           frontend/public/_redirects, which carries the blog prerender
#           rules (/blog/* -> /blog/:splat/index.html 200).
#
#       Backend
#         - CORS_ORIGIN is now ENFORCED by cors() (src/index.ts), not just
#           echoed in /api/health. Set it to a comma-separated list of
#           EVERY origin the app is served from, or the custom domains
#           get locked out:
#             https://reanalyzr.com,https://www.reanalyzr.com,
#             https://theficouple.reanalyzr.com,
#             https://real-estate-analyzer-9ise.onrender.com
#         - BILLING_ENABLED=false for the free beta (see Issue #260).
#
services:
  - type: web
    name: real-estate-analyzer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # CORS_ORIGIN is now ENFORCED by the cors() middleware (src/index.ts),
      # not just echoed in /api/health. It must therefore list EVERY origin
      # the app is served from — `fromService` would yield only the
      # *.onrender.com URL and lock out the custom domains.
      #
      # Set in the dashboard as a comma-separated list, e.g.:
      #   https://reanalyzr.com,https://www.reanalyzr.com,
      #   https://theficouple.reanalyzr.com,
      #   https://real-estate-analyzer-9ise.onrender.com
      #
      # If it is left unset the server logs a warning and falls back to
      # permissive CORS — degraded, but not an outage.
      - key: CORS_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CENSUS_API_KEY
        sync: false
    autoDeploy: true

  - type: static_site
    name: real-estate-analyzer-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build && mkdir -p build && cp -r dist/* build/
    publishDir: build
    # VITE_API_URL is deliberately NOT declared here.
    #
    # Render blueprints do not interpolate `${service.url}` in a `value:`
    # — the literal string gets baked into the JS bundle at build time and
    # every API call fails. `fromService:` (see CORS_ORIGIN above) is the
    # supported form, but it yields the bare origin and this app needs the
    # `/api` suffix (services/api.ts uses it as the axios baseURL and every
    # caller passes bare paths like `/deals`).
    #
    # So it is set explicitly in the Render dashboard:
    #   VITE_API_URL = https://real-estate-analyzer-api.onrender.com/api
    autoDeploy: true
    # No `routes:` block here on purpose. frontend/public/_redirects owns
    # routing — it carries the blog prerender rules
    # (/blog/* -> /blog/:splat/index.html 200) that make
    # scripts/prerender-blog.mjs worth running, plus the trailing-slash
    # 301s, and it ends with the SPA catch-all. A blanket rewrite here
    # would shadow the prerendered HTML and hand Googlebot the SPA shell.
    headers:
      # Only the HTML entry point must never be cached — it's what points
      # at the current hashed bundle. Vite's /assets/* filenames are
      # content-hashed and safe to cache hard; a blanket no-store made
      # every page load re-download the whole bundle.
      - path: /index.html
        name: Cache-Control
        value: no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable 