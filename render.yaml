services:
  - type: web
    name: real-estate-analyzer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        fromService:
          name: real-estate-analyzer-frontend
          type: static_site
          property: url
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CENSUS_API_KEY
        sync: false
    autoDeploy: true

  - type: static_site
    name: real-estate-analyzer-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build && mkdir -p build && cp -r dist/* build/
    publishDir: build
    envVars:
      - key: VITE_API_URL
        value: ${real-estate-analyzer-api.url}/api
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-store 