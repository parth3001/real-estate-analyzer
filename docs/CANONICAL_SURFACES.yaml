scan_metadata:
  scanned_at: "2026-07-08 (session)"
  scanner: "Explore agent, first-pass automated draft; user-reviewed 2026-07-09"
  files_scanned: 180
  files_categorized: 92
  unknown_needs_review: 1
  summary: >
    Backend architecture is in mid-migration: substrate + agent-mesh (W1-W6)
    is LIVE canonical (score_deal → projectToEventPayloads →
    AnalysisEvent+DecisionEvent → dealMaterializationService → legacy Deal).
    V3.0 InvestmentDecisionEngine + BaseDecisionEngine + MFDecisionEngine +
    SFR/MultiFamily/BRRRR analyzers are LIVE — no V1/V2 files exist
    alongside them (already excised). Only inline "// LEGACY" markers on
    individual fields remain.
    User decisions 2026-07-09 (see LEGACY entries below):
      - Pre-substrate GPT-4o-mini pipeline (aiService, aiOrchestrator,
        predictionEngine) → LEGACY. Substrate agents supersede it.
      - Wizard flow (SFRAnalysis, MFAnalysis pages + wizardRoutes,
        quickAnalysis, analyzeRoutes) → LEGACY. Retiring in favor of chat.
      - pdfService (wizard-shape PDF) → LEGACY. SubstrateDealPdf is
        canonical for chat/substrate deals.
      - quickCalculationService (real-time /api/quick) → LEGACY. Was a
        customer-acquisition play; chat now serves that role.
    Frontend is mid-migration from AppleNavigation shell (LEGACY, still
    routes /sfr-analysis /mf-analysis /admin) to AppLayout / NewAppShell
    chat-first shell (LIVE). MainLayout.tsx and Dashboard.tsx are dead
    code (not routed). ~9 .bak/.old/.fix/.tmp files in backend/src/
    controllers/ are pure LEGACY.
    Remaining human review (1): aiEnhancedMessaging + goalExtractionService
    + openai.ts are GPT-4o-mini-adjacent and marked LIVE because LIVE
    decision engines still call them. If those calls should be removed
    with the GPT pipeline sunset, these three cascade to LEGACY too.

